<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Catálogo de Filmes</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Minha Vitrine de Filmes</h1>
        <p>Os meus filmes favoritos de todos os tempos.</p>
    </header>
    
    <section class="adicionar-filme" style="text-align: center; margin-bottom: 20px;">
        <input type="text" id="novo-filme" placeholder="Digite o nome do filme..." style="padding: 10px; width: 300px; border-radius: 4px; border: 1px solid #ccc;">
        <button id="btn-adicionar" style="padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">Adicionar à Lista</button>
    </section>

    <div id="painel-navegacion" style="text-align: center; margin-bottom: 20px; display: none;">
        <button id="btn-voltar" style="padding: 10px 20px; background: #374151; color: #ffffff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: background 0.2s;">
            ← Voltar para Meus Salvos
        </button>
    </div>
    
    <div class="painel-categorias" style="display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; flex-wrap: wrap;">
        <button class="btn-categoria active" data-genre="all" style="padding: 8px 16px; background: #f5c518; color: #121212; border: none; border-radius: 20px; font-weight: bold; cursor: pointer;">⭐ Meus Salvos</button>
        
        <button class="btn-categoria" data-genre="recomendacao" style="padding: 8px 16px; background: #1f1f1f; color: #f3f4f6; border: 1px solid #374151; border-radius: 20px; cursor: pointer;">🎲 Me Recomende</button>
        
        <button class="btn-categoria" data-genre="28" style="padding: 8px 16px; background: #1f1f1f; color: #f3f4f6; border: 1px solid #374151; border-radius: 20px; cursor: pointer;">Ação (Top 20)</button>
        <button class="btn-categoria" data-genre="12" style="padding: 8px 16px; background: #1f1f1f; color: #f3f4f6; border: 1px solid #374151; border-radius: 20px; cursor: pointer;">Aventura (Top 20)</button>
        <button class="btn-categoria" data-genre="35" style="padding: 8px 16px; background: #1f1f1f; color: #f3f4f6; border: 1px solid #374151; border-radius: 20px; cursor: pointer;">Comédia (Top 20)</button>
        <button class="btn-categoria" data-genre="18" style="padding: 8px 16px; background: #1f1f1f; color: #f3f4f6; border: 1px solid #374151; border-radius: 20px; cursor: pointer;">Drama (Top 20)</button>
        <button class="btn-categoria" data-genre="27" style="padding: 8px 16px; background: #1f1f1f; color: #f3f4f6; border: 1px solid #374151; border-radius: 20px; cursor: pointer;">Terror (Top 20)</button>
        <button class="btn-categoria" data-genre="10749" style="padding: 8px 16px; background: #1f1f1f; color: #f3f4f6; border: 1px solid #374151; border-radius: 20px; cursor: pointer;">Romance (Top 20)</button>
        <button class="btn-categoria" data-genre="878" style="padding: 8px 16px; background: #1f1f1f; color: #f3f4f6; border: 1px solid #374151; border-radius: 20px; cursor: pointer;">Ficção (Top 20)</button>
        <button class="btn-categoria" data-genre="16" style="padding: 8px 16px; background: #1f1f1f; color: #f3f4f6; border: 1px solid #374151; border-radius: 20px; cursor: pointer;">Animação (Top 20)</button>
    </div>
    
    <main class="grid-catalogo">
    </main>

    <script src="script.js"></script>
</body>
</html>
